name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Organizar arquivos
        run: |
          mkdir -p www assets keystore
          mv app.js index.html styles.css sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png www/
          mv icon-only.png icon-foreground.png icon-background.png assets/
          mv debug.keystore keystore/
      - run: npm install
      - run: npx cap add android
      - name: Icones
        run: |
          npx capacitor-assets generate --android --iconBackgroundColor '#0f766e' --iconBackgroundColorDark '#0f766e'
      - name: Permissoes e versao
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $M || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' $M
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.1.${{ github.run_number }}\"/" android/app/build.gradle
      - run: npx cap sync android
      - name: Chave de assinatura fixa
        run: mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk casa-em-ordem.apk
      - uses: actions/upload-artifact@v4
        with:
          name: casa-em-ordem-apk
          path: casa-em-ordem.apk
      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.1.${{ github.run_number }}" casa-em-ordem.apk --title "Casa em Ordem 1.1.${{ github.run_number }}" --notes "APK de teste (debug) para instalar no Android."
